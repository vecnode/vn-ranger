# vn-ranger mark manifest
#
# Generated from the files in this directory. Every digest is the file's own.
# Regenerate this file whenever a mark or a rendered size changes.

[mark]
name = "vn-ranger"
version = "1.0"
date = "2026-10-17"
grid = 24
stroke = 2.914
facets = 6
viewbox = "0 0 24 24"
geometry = "hexagon (12,2.8) (20.8,7.4) (20.8,16.6) (12,21.2) (3.2,16.6) (3.2,7.4); crown ridge (3.2,7.4)-(12,12)-(20.8,7.4); spine (12,2.8)-(12,21.2); girdle (12,15.4)-(3.2,16.6) and (12,15.4)-(20.8,16.6)"

[palette]
ember = "#F26A21"
ember_highlight = "#FFA45E"
ember_deep = "#D14A0C"
ink = "#0B0D10"
paper = "#FFFFFF"
muted = "#9AA1AC"

[contrast]
ember_on_ink = "6.36:1"
ink_on_ember = "6.36:1"
white_on_ember = "3.06:1 (large text and icons only)"
ember_on_paper = "3.06:1 (large text and icons only)"
highlight_on_ink = "9.94:1"

[application_icon]
tile_px = 1024
tile_radius_px = 308
mark_scale = 22.73
mark_translate_px = 239.25
tile_fill = "#0B0D10"
ridge = "#FFFFFF"
rgba_px = 64

[suite]
rule = "same crystal, one colour per application"
vn-launcher = "no inlay"
vn-ranger = "ember inlay"

