[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/vecnode/vn-ranger"
homepage = "https://github.com/vecnode/vn-ranger"
authors = ["vecnode"]
keywords = ["security", "endpoint", "egui", "cross-platform"]
categories = ["gui", "os"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
manual_let_else = "warn"
redundant_else = "warn"
semicolon_if_nothing_returned = "warn"

[workspace.dependencies]
vnr-core = { path = "crates/core" }
vnr-native = { path = "crates/native" }
vnr-ui = { path = "crates/ui" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
log = "0.4.34"
env_logger = "0.11.11"

egui = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false }
eframe = { version = "0.37.0", default-features = false }

sysinfo = "0.39.6"
sha2 = "0.11.1"
sha1 = "0.11.0"
md-5 = "0.11.0"
hex = "0.4.3"
directories = "6.0.0"
plist = "1.10.1"
tempfile = "3.27.0"
opener = "0.9.0"

# The action path's one unconditional dependency (docs/PLAN.md §6.10). A destructive act
# is resolved from an already-open directory handle rather than from a path, and `cap-std`
# is what makes that expressible on Windows too: `std` cannot open with
# FILE_FLAG_OPEN_REPARSE_POINT, so a check-then-use there would be a race, not a refusal.
cap-std = "4.0.3"

# Watching files. CC0-1.0 is a public-domain dedication with no attribution or
# copyleft burden, added to the allowlist in AGENTS.md §8 for this crate alone.
# Default features are off: the macOS build uses the pure-Rust kqueue backend
# rather than fsevent-sys.
notify = { version = "8.2.0", default-features = false }

# Windows-only: each wraps an OS API behind a safe Rust interface, so the
# workspace keeps `unsafe_code = "forbid"`. None of them is a C dependency.
winreg = "0.56.0"
netstat2 = "0.11.2"
is_elevated = "0.1.2"
runas = "1.2.0"

# Unix-only: effective uid for the elevation status.
nix = { version = "0.31.3", features = ["user"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# CI compiles the same code without the development concessions. Optimising every
# dependency is what makes the application feel right to run, and what makes a check
# take minutes: egui, wgpu and naga are most of the tree. This profile compiles them
# unoptimised and keeps line tables, so a failing test still says where.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
incremental = false

[profile.ci.package."*"]
opt-level = 0
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
