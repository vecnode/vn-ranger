[package]
name = "vn-ranger"
description = "A resident, local-only system ranger for Windows, macOS and Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
default-run = "vn-ranger"
publish = false

[lints]
workspace = true

[dependencies]
vnr-core = { workspace = true }
vnr-native = { workspace = true }
vnr-ui = { workspace = true }
# `clipboard` is not in the list by accident: `default-features = false` drops eframe's
# default set, and without this feature there is no clipboard backend at all — Ctrl+C and
# every "Copy" button silently did nothing. It brings `arboard` (MIT OR Apache-2.0), which
# is inside the §8 allowlist.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde_json = { workspace = true }
opener = { workspace = true }
