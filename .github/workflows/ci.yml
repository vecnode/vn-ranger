name: CI

# Three operating systems, but not on every commit.
#
# A push to main runs one job, on the platform a Windows development machine cannot check
# for itself. The full matrix runs on a pull request, when asked,
# and — through `workflow_call` — as the gate a release passes before it publishes
# anything. That is the whole policy: the check that must never be skipped is the one at
# the cut, and it is the cut that now pays for it.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/logo/**'
      - 'assets/screenshots/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/logo/**'
      - 'assets/screenshots/**'
  workflow_dispatch:
  workflow_call:

# A superseded push has nothing to say. Cancel it and let the cache serve the next one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # The matrix is chosen by the event rather than written twice, so the caller and the
  # push cannot disagree about what "checked" means.
  plan:
    name: Choose the matrix
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  check:
    name: ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu latest for the quick check; the release workflow uses 22.04 for glibc.
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vn-ranger-ci
          cache-on-failure: true

      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libgl1-mesa-dev

      # The same command a contributor runs. It checks formatting, bans network
      # crates and socket code, runs clippy with warnings denied, tests the pure
      # core and the native collectors, and type-checks the UI and shell.
      - name: Check
        run: cargo xtask ci

      # A `#[cfg]` bug lives on the platform that is not being compiled, and this repository
      # has just had two: a path that only resolves on Unix, and a helper only Windows called.
      # The Windows runner is the one that can type-check the Linux code without spending a
      # matrix slot on it.
      - name: Type-check the other two platforms from Windows
        if: runner.os == 'Windows'
        run: |
          rustup target add x86_64-unknown-linux-gnu x86_64-apple-darwin
          cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu -- -D warnings
          # The macOS collectors compile without a Mac; only the linking and the running
          # need one, and `check` does neither.
          cargo clippy --package vnr-native --all-targets --target x86_64-apple-darwin -- -D warnings

      # The optional features are deliberately not in the default build, which is exactly
      # why they need their own step: code behind a feature flag is code no default check
      # compiles. This is the content scan, and it pulls a pattern engine with it.
      - name: Optional features
        run: cargo xtask features
